function lap(){$('#main').innerHTML=`<div class=hd><h2>Laporan Transaksi Pembayaran Tagihan</h2><div class=no><button class=g data-go=rek>Rekap Kolektor</button> <button class=g id=pr>Cetak</button> <button class=g id=dl>Unduh CSV</button></div></div>`+fb(1)+'<div id=tb></div>';bind(lapT);lapT();
$('#pr').onclick=prn;$('#dl').onclick=()=>csv(flt(0,1),'laporan-transaksi.csv')}
function rek(){const e=grp(flt(1),r=>r.o);$('#main').innerHTML=`<div class=hd><h2>Rekap per Kolektor</h2><button class=g id=pr>Cetak</button></div><p class=mu>${per()}</p>`+fb(0)+`<div class=card>${rekTbl(e,S.k)}</div>`;bind(rek);links();$('#pr').onclick=()=>print()}
function cus(){const ks=uniq(cust,c=>c.o),js=uniq(cust,c=>c.j),op=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
$('#main').innerHTML=`<h2>Data Pelanggan</h2><p class=mu>${fmt(cust.length)} pelanggan terdaftar</p>${addBox()}<div class="fb card"><label>Cari<input type=search id=cq placeholder="nama / ID"></label><label>Kolektor<select id=ck><option value="">Semua</option>${op(ks)}</select></label><label>Jenis<select id=cj><option value="">Semua</option>${op(js)}</select></label></div><div id=tb></div>`;
const u=()=>{const q=$('#cq').value.toLowerCase(),k=$('#ck').value,j=$('#cj').value,R=cust.filter(c=>(!k||c.o===k)&&(!j||c.j===j)&&(!q||(c.n+' '+c.id).toLowerCase().includes(q)));
$('#tb').innerHTML=`<p class=mu>${fmt(R.length)} pelanggan${R.length>200?' (menampilkan 200 pertama, persempit pencarian)':''}</p>`+tbl(['No','ID Pelanggan','Nama Pelanggan','Jenis Transaksi','Kolektor'],R.slice(0,200).map((c,i)=>[i+1,esc(c.id),esc(c.n),esc(c.j),esc(c.o)]))};
['cq','ck','cj'].forEach(i=>$('#'+i).oninput=u);u();bindAdd()}
function inp(){const ks=uniq(base,r=>r.o),js=uniq(base,r=>r.j);let man=0;
$('#main').innerHTML=`<h2>Input Pembayaran</h2><p class=mu>Transaksi baru tersimpan di browser ini (bukan di server). Unduh CSV secara berkala untuk dipindahkan ke Excel.</p>
<form id=fm class=card><div class=fm><label>Tanggal<input type=date name=d value="${today}" required></label><label>ID Pelanggan<input name=id required autocomplete=off></label><label>Nama Pelanggan<input name=n required></label>
<label>Jenis Transaksi<input name=j list=jl required></label><datalist id=jl>${js.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><label>Jumlah Tagihan<input type=number name=t min=0 value=0 required></label><label>Jumlah Bayar<input type=number name=b min=0 value=0 required></label>
<label>Fee Trx (otomatis)<input name=f readonly value=0></label><label>Iuran Kebersihan<input type=number name=u min=0 value=0></label><label>Keterangan<select name=c><option>Cash</option><option>Bon</option></select></label>
<label>Kolektor<input name=o list=kl required></label><datalist id=kl>${ks.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><p><button class=p type=submit>Simpan Transaksi</button> <span class=ok id=ms></span></p></form>
<div class=hd style="margin-top:20px"><h3>Transaksi baru di browser ini (${loc.length})</h3><button class=g id=dl>Unduh CSV</button></div><div id=tb></div>`;
const f=$('#fm'),el=n=>f.elements[n],fee=()=>el('f').value=Math.max(0,el('b').value-el('t').value);
el('id').onblur=()=>{const i=el('id').value.trim(),c=cust.find(c=>String(c.id)===i)||(all().filter(r=>String(r.id)===i).pop());if(c){el('n').value=c.n;el('j').value=c.j;el('o').value=c.o}};
el('t').oninput=()=>{if(!man)el('b').value=Math.ceil(el('t').value/CFG.k)*CFG.k;fee()};el('b').oninput=()=>{man=1;fee()};
f.onsubmit=ev=>{ev.preventDefault();const g=n=>el(n).value,d=new Date(),p=x=>String(x).padStart(2,'0');
loc.push({d:g('d'),id:g('id').trim(),n:g('n').trim().toUpperCase(),k:'TRX'+g('d').replace(/-/g,'')+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()),j:g('j').trim(),t:+g('t'),b:+g('b'),f:+g('f'),u:+g('u'),c:g('c'),o:g('o').trim().toUpperCase()});save();if(S.to&&S.to<g('d'))S.to=g('d');inp();$('#ms').textContent='Transaksi tersimpan.'};
$('#dl').onclick=()=>loc.length&&csv(loc,'transaksi-baru.csv');
$('#tb').innerHTML=tbl(['Tanggal','ID','Nama','Jenis','Bayar','Ket.','Kolektor',''],loc.map((r,i)=>[dm(r.d),esc(r.id),esc(r.n),esc(r.j),fmt(r.b),esc(r.c),esc(r.o),`<button class=x data-i=${i}>Hapus</button>`]).reverse(),'lllrlll');
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(confirm('Hapus transaksi ini?')){loc.splice(+b.dataset.i,1);save();inp()}})}
function render(){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));({dash,inp,cus,lap,rek,set:setg})[S.v]();scrollTo(0,0)}
document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;S.pg=0;render()});
buildAside();render();
</script></body></html>
